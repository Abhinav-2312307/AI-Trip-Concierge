<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="luxury-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1626" />
      <stop offset="100%" stop-color="#1B2D48" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="100%" stop-color="#FDA085" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#C85A3D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#luxury-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#gold-accent)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Dial -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="6,8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold-accent)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Compass Star / Needle -->
  <!-- North Point -->
  <polygon points="256,90 286,240 256,256" fill="url(#terracotta)" filter="url(#glow)" />
  <polygon points="256,90 226,240 256,256" fill="#F4A261" />
  <!-- South Point -->
  <polygon points="256,422 226,272 256,256" fill="#E2E8F0" />
  <polygon points="256,422 286,272 256,256" fill="#94A3B8" />
  <!-- East Point -->
  <polygon points="422,256 272,226 256,256" fill="#CBD5E1" />
  <polygon points="422,256 272,286 256,256" fill="#64748B" />
  <!-- West Point -->
  <polygon points="90,256 240,286 256,256" fill="#CBD5E1" />
  <polygon points="90,256 240,226 256,256" fill="#64748B" />

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="18" fill="url(#gold-accent)" />
  <circle cx="256" cy="256" r="8" fill="#0B1626" />

  <!-- N Marker -->
  <text x="256" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#FDBA74" text-anchor="middle">N</text>
</svg>
